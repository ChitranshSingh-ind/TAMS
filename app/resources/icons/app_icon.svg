<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023A6B"/>
      <stop offset="50%" stop-color="#012D54"/>
      <stop offset="100%" stop-color="#001830"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E19E"/>
      <stop offset="40%" stop-color="#D9B85F"/>
      <stop offset="100%" stop-color="#B89438"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#navyBg)" filter="url(#dropShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.75"/>

  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="256,120 400,185 256,250 112,185" fill="url(#goldGrad)"/>
  
  <!-- Cap Under-cap / Skull -->
  <path d="M168,212 L168,260 C168,295 344,295 344,260 L344,212 Z" fill="#997825" opacity="0.9"/>
  <path d="M174,215 L174,256 C174,286 338,286 338,256 L338,215 Z" fill="#B89438"/>

  <!-- Tassel -->
  <circle cx="256" cy="185" r="7" fill="#FEFEFE"/>
  <path d="M256,185 Q360,200 376,260" fill="none" stroke="#FEFEFE" stroke-width="6" stroke-linecap="round"/>
  <circle cx="376" cy="265" r="9" fill="#F3E19E"/>
  <rect x="372" y="272" width="8" height="20" rx="3" fill="#D9B85F"/>

  <!-- Open Book & Analytics Pages -->
  <path d="M130,320 C190,305 240,318 248,340 L248,400 C240,378 190,365 130,380 Z" fill="#FEFEFE"/>
  <path d="M382,320 C322,305 272,318 264,340 L264,400 C272,378 322,365 382,380 Z" fill="#FEFEFE"/>

  <!-- Book Spine / Center Glow -->
  <path d="M256,335 L256,405" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Growth / Analytics Bars across book pages -->
  <rect x="160" y="348" width="16" height="18" rx="3" fill="#012D54" opacity="0.8"/>
  <rect x="185" y="338" width="16" height="28" rx="3" fill="#012D54" opacity="0.8"/>
  <rect x="210" y="330" width="16" height="36" rx="3" fill="#012D54" opacity="0.8"/>

  <rect x="286" y="330" width="16" height="36" rx="3" fill="#012D54" opacity="0.8"/>
  <rect x="311" y="322" width="16" height="44" rx="3" fill="#D9B85F"/>
  <rect x="336" y="312" width="16" height="54" rx="3" fill="#15803D"/>
</svg>