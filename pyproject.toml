[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tams"
version = "2.0.0"
description = "TAMS — Tuition & Coaching Management System with Automated Companion Messaging"
readme = "README.md"
authors = [
    { name = "Chitransh Singh" }
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
tams = "main:main"
coaching-helper = "coaching_helper_main:main"
