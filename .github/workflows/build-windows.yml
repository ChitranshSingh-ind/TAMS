name: Build Windows Application & Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup 6
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Inno Setup is already installed."
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Build binaries with PyInstaller
        run: python -m PyInstaller --clean --noconfirm tams.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            throw "Inno Setup compiler (iscc) not found"
          }

      - name: Compress Installer into ZIP
        run: |
          Compress-Archive -Path Output\*.exe -DestinationPath Output\TAMS-Windows-Setup.zip -CompressionLevel Fastest -Force

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAMS-Windows-Installer
          path: Output/*
          compression-level: 0
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/*.exe
            Output/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
